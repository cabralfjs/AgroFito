name: Atualizar dados de LMR (UE)

# Corre uma vez por semana, à segunda-feira às 07:30 UTC (desfasado do
# workflow principal, que corre às 06:00), e também pode ser despoletado
# manualmente a partir do separador "Actions" do GitHub.
on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch: {}

# Sem permissões por defeito; o job pede apenas o que precisa.
permissions: {}

# Partilha o grupo com update.yml: nunca correm em simultâneo.
concurrency:
  group: agrofito-dados
  cancel-in-progress: false

jobs:
  atualizar-lmr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Correr o script de atualização
        run: python update_lmr.py

      - name: Verificar se algum ficheiro mudou (e só em lmr/)
        id: diff
        run: |
          # Qualquer alteração fora de lmr/ é inesperada: falha o workflow.
          FORA=$(git status --porcelain | grep -v -E '^( M|\?\?| D|A |D |M ) "?lmr/' || true)
          if [ -n "$FORA" ]; then
            echo "Alterações inesperadas fora de lmr/:"
            echo "$FORA"
            exit 1
          fi
          if [ -z "$(git status --porcelain -- lmr/)" ]; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar os ficheiros atualizados
        if: steps.diff.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lmr/
          git commit -m "Atualização automática dos dados de LMR ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Sem alterações
        if: steps.diff.outputs.mudou == 'false'
        run: echo "Os dados de LMR não mudaram desde a última atualização."
